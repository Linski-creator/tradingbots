name: Paper-Trading

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde, 7 Minuten nach der vollen Stunde
  workflow_dispatch: {}    # manuell starten über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false   # nie zwei Läufe gleichzeitig

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (Bots laufen nur, wenn alle Tests grün sind)
        run: python -m pytest -q
      - name: Bots ausführen
        run: python -m bots.paper
      - name: Zustand und Dashboard speichern
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Paper-Trading $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push
