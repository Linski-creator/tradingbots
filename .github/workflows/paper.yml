name: Paper-Trading

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde, 7 Minuten nach der vollen Stunde
  workflow_dispatch: {}    # manuell starten über den Actions-Tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-trading
  cancel-in-progress: false   # nie zwei Läufe gleichzeitig

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (Bots laufen nur, wenn alle Tests grün sind)
        run: python -m pytest -q
      - name: Bots ausführen
        run: python -m bots.paper
      - name: Zustand und Dashboard speichern
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Paper-Trading $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main && git push
      - name: Webseite bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  webseite:
    # Veröffentlicht site/ über GitHub Pages. Schlägt das fehl (Pages nicht
    # eingeschaltet), läuft das Paper-Trading trotzdem normal weiter.
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
